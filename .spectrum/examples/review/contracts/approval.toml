[contract]
id = "contract-approval"
object_ids = ["obj-proposal"]
interaction_ids = ["int-approve-proposal"]

[policy]
approval_binds_exact_content = true
revision_change_requires_review = true
approval_does_not_apply_changes = true

[state]
allowed = ["draft", "in_review", "approved", "stale"]

[interaction.int-approve-proposal]
reads = ["proposal.content_sha256", "proposal.base_revision", "repository.current_revision"]
writes = ["proposal.approval", "proposal.state"]

