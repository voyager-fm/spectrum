[contract]
id = "spectrum.proposal"
category = "LOOP"
primary_object_key = "change_set"
display_region = "web.proposals"

[vocabulary]
base_revision = "Repository revision against which the proposal was prepared."
content_digest = "Digest of the exact proposed edit content."

[policy]
approval_required = true
approval_binds = ["base_revision", "content_digest", "actor", "timestamp", "original_file_hashes"]
revalidate_before_apply = true
stale_proposal_result = "Return to human review."
repository_data_grants_authority = false
automatic_merge = false
automatic_publication = false
maximum_repair_attempts = 2

[ownership."LOOP-001-review_proposal"]
reads = ["change_set", "repository", "review_result"]
writes = ["change_set.review_state"]
