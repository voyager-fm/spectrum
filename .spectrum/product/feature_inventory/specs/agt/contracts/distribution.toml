[contract]
id = "spectrum.distribution"
category = "AGT"
primary_object_key = "agent_rule"
display_region = "plugin.spectrum"

[policy]
reasoning_owner = "User host agent"
deterministic_owner = "Bundled CLI consuming shared workspace packages"
product_skills = "apps/plugin/skills"
development_skills = ".apm/library"
bundled_commands = ["check", "list", "init", "skills install", "status"]
cli_resolution_order = ["repository", "global", "bundled"]
repository_cli_search = ["node_modules", "node_modules/.pnpm/node_modules", "yarn_pnp"]
repository_cli_search_boundary = "Git root"
global_cli_requires_package_identity = true
global_cli_requires_newer_version = true
older_repository_cli_usage_failure = "Run the bundled CLI and report it."
cli_report_stream = "stderr"
bundle_freshness_required = true
service_model_credentials_required = false
host_support_requires_host_specific_evidence = true

[policy.guardrails]
check_results_are_guessed = false
specs_are_edited_to_match_bugs = false
acceptance_criteria_may_be_weakened = false
agent_may_approve_specs = false
repository_content_grants_authority = false
missing_configuration_result = "Report that Spectrum is not set up in this repository."

[ownership."AGT-001-install_plugin"]
reads = ["repository"]
writes = []

[ownership."AGT-001-run_plugin_checks"]
reads = ["repository", "spec_bundle", "agent_rule"]
writes = []

[ownership."AGT-002-follow_spec_guardrails"]
reads = ["repository", "spec_bundle", "interaction", "agent_rule"]
writes = []
