[contract]
id = "spectrum.setup"
category = "SET"
primary_object_key = "configuration"
display_region = "cli.output"

[policy]
package_name = "@voyager-fm/spectrum"
binary = "spectrum"
package_published = false
runtime_dependencies = false
setup_paths_owner = "@spectrum/spec-engine/setup"
writes_outside_repository = false
follows_links_outside_repository = false
init_overwrites_existing_paths = false
init_is_all_or_nothing = true
skill_paths = [".claude/skills/spectrum/SKILL.md", ".agents/skills/spectrum/SKILL.md"]
skill_provenance_marker = "Generated by @voyager-fm/spectrum"
skill_replaces_unmarked_file_without_force = false
starter_grants_approval = false
dashboard_writes_to_repository = false
unqualified_npx_guidance = false

[ownership."SET-001-install_cli_package"]
reads = ["cli_package"]
writes = []

[ownership."SET-002-initialize_repository"]
reads = ["repository"]
writes = ["configuration", "spec_bundle"]

[ownership."SET-003-install_repository_skills"]
reads = ["repository", "agent_skill"]
writes = ["agent_skill"]

[ownership."SET-003-run_repository_skill"]
reads = ["repository", "spec_bundle", "interaction", "agent_rule", "cli_package"]
writes = []

[ownership."SET-004-view_setup_checklist"]
reads = ["repository", "configuration", "cli_package", "agent_skill"]
writes = []
